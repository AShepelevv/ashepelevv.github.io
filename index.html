<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body class="body">
<a id="container" class="container" href="https://science.nasa.gov/apod/" target="_blank">
  <div id="error-container" class="error">
    <p id="error">
      <span id="loader" class="loader"></span>
    </p>
  </div>
  <div id="bottom-sheet" class="bottom-sheet">
    <div id="title" class="title"></div>
    <div id="description" class="description"></div>
  </div>
</a>
</body>
<script>
  const toPlainDescription = (explanation) => {
    const mainPart = explanation.split(/<br\s*\/?>\s*(?:<[^>]*>\s*)*?<br\s*\/?>/i)[0];
    const text = new DOMParser().parseFromString(mainPart, 'text/html').body.textContent;
    return text.replace(/\s+/g, ' ').trim().replace(/^Explanation\s*:\s*/i, '');
  };

  const showError = (description) => {
    document.getElementById('bottom-sheet').remove();
    document.getElementById('error').innerHTML = description;
  };

  fetch('data.json').then((response) => {
    return response.json();
  }).then((json) => {
    if (json.permalink) {
      document.getElementById('container').href = json.permalink;
    }
    if (!json.hdurl) {
      document.getElementById('error').innerHTML = 'Failed to parse APOD data loaded today. <br/><br/> Please visit the <a href="https://science.nasa.gov/apod/" target="_blank">NASA website</a> to view the picture';
      document.getElementById('bottom-sheet').remove();
      return;
    }
    const backgroundImage = new Image();
    backgroundImage.onload = () => {
      document.getElementById('loader').remove();
      document.getElementById('container').style.backgroundImage = 'url("' + backgroundImage.src + '")';
    };
    backgroundImage.src = json.hdurl;
    document.getElementById('description').textContent = toPlainDescription(json.explanation || '');
    document.getElementById('title').innerHTML += json.title;
  }).catch(() => {
    showError('Failed to parse APOD data loaded today');
  });
</script>
</html>
